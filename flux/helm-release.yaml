apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mychart
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: ./mychart
      sourceRef:
        kind: GitRepository
        name: helmtemplates
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    replicaCount: 1
    image:
      repository: nginx
      pullPolicy: IfNotPresent
      tag: ""
    service:
      type: ClusterIP
      port: 80
