repos:
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm lint (validate values.yaml against chart)
        language: system
        entry: helm lint mychart --values mychart/values.yaml
        pass_filenames: false
        files: ^mychart/

  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs
        args:
          - --chart-search-root=mychart
          - --document-dependency-values
