global: {}

# -- Values passed through to the common library subchart
common: {}

# @schema
# minimum: 1
# @schema
# -- Number of pod replicas
replicaCount: 1

# @schema
# required: [repository, pullPolicy]
# @schema
image:
  # @schema
  # minLength: 1
  # @schema
  # -- Container image repository
  repository: app-alpha
  # @schema
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion when empty
  tag: ""

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the pod
  create: true
  # -- Automount the ServiceAccount API token
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount. Generated from the fullname template when empty
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}
# -- Labels to add to the pod
podLabels: {}

# -- Pod-level security context. Inherits from global.podSecurityContext when empty
podSecurityContext: {}

# -- Container-level security context. Inherits from global.securityContext when empty
securityContext: {}

# @schema
# required: [type, port]
# @schema
service:
  # @schema
  # enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
  # @schema
  # -- Kubernetes Service type
  type: ClusterIP
  # @schema
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- Service port
  port: 8080

# -- Container resource requests and limits
resources: {}

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  # -- Enable HorizontalPodAutoscaler
  enabled: false
  # @schema
  # minimum: 1
  # @schema
  # -- Minimum number of replicas
  minReplicas: 1
  # @schema
  # minimum: 1
  # @schema
  # -- Maximum number of replicas
  maxReplicas: 10
  # @schema
  # minimum: 1
  # maximum: 100
  # @schema
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# -- Additional volumes
volumes: []
# -- Additional volume mounts
volumeMounts: []

# -- Node selector for pod scheduling
nodeSelector: {}
# -- Tolerations for pod scheduling
tolerations: []
# -- Affinity rules for pod scheduling
affinity: {}
